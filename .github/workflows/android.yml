# Builds the Android app (android/) into RouterHome.apk.
# Runs when something in android/ changes, by hand (Actions → Android app →
# Run workflow), and when a release is published (the APK is then attached).
#
# The signing key comes from two repository secrets (Settings → Secrets and
# variables → Actions); they're never shown in logs or to forks:
#   ANDROID_KEYSTORE           routerhome.keystore as base64 (base64 -w0 routerhome.keystore)
#   ANDROID_KEYSTORE_PASSWORD  its password
name: Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets (see android/README.md)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/routerhome.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=routerhome\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/routerhome.keystore" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build
        run: |
          sh ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk RouterHome.apk

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/routerhome.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: RouterHome-apk
          path: android/RouterHome.apk

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" RouterHome.apk --clobber
